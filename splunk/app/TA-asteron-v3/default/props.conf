# This sourcetype is used only for the generated HEC-envelope ingest file.
# HEC event metadata overrides host/source/sourcetype/_time per event, leaving
# the indexed _raw as the source-native event contained in the "event" field.
[asteron:hec]
INDEXED_EXTRACTIONS = HEC
KV_MODE = none
SHOULD_LINEMERGE = false
TRUNCATE = 0
